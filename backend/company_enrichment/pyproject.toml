[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-company-enrichment"
version = "0.1.0"
description = "Industrial company enrichment pipeline for large SIRENE datasets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "dnspython>=2.7.0",
  "duckdb>=1.2.2",
  "httpx>=0.28.1",
  "polars>=1.29.0",
  "pydantic>=2.11.0",
  "pyyaml>=6.0.2",
  "selectolax>=0.3.26",
  "tenacity>=9.1.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.3.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
